   dm:
      display-name: DM
      commands:
      - dm
      - narrate
      use-perm: orpchat.adminchat
      read-perm: orpchat.adminchat
      color-code-perm: orpchat.usecolors
      format: '&7{message}'
      range: 64
      cooldown: 0

