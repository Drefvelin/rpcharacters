# OpenRP Chat

# Permission to bypass the "cooldown" value of each channel.
bypass-cooldown-perm: orpchat.bypasscooldown

# This is used if you type something in chat with no command. 
# Remove this line to not have this feature.
default: rp

channels:
   
   # In the default config, there are several channels added
   # You can add your own custom channels according to this guide (+ FAQ!):
   # https://github.com/fishydarwin/OpenRP/wiki/%5B2%5D-OpenRP-Chat.-How-do-I-set-it-up%3F
   
   rp:
      display-name: RP
      commands:
      - rp
      use-perm: orpchat.default
      read-perm: orpchat.default
      color-code-perm: orpchat.usecolors
#      format: '&f[&eRP&f] &f{orpdesc_name}: &f"&e{message}&f"'
      format: '&f{orpdesc_name}&e: &f"&e{message}&f"'
      range: 15
      cooldown: 0
#      action:
#         symbol: '*'
#         replacement:
#            outside-of-actions: '&f'
#            for-actions: '&e*'
   shout:
      display-name: Shout
      commands:
      - shout
      use-perm: orpchat.default
      read-perm: orpchat.default
      color-code-perm: orpchat.usecolors
#      format: '&f[&6Shout&f] &f{orpdesc_name}: &f"&6{message}&f"'
      format: '&f{orpdesc_name}&6 shouts: &f"&6{message}&f"'
      range: 24
      cooldown: 0
#      action:
#         symbol: '*'
#         replacement:
#            outside-of-actions: '&f'
#            for-actions: '&e*'
   yell:
      display-name: Yell
      commands:
      - yell
      - y
      use-perm: orpchat.default
      read-perm: orpchat.default
      color-code-perm: orpchat.usecolors
#      format: '&f[&cYell&f] &f{orpdesc_name}: &f"&c&l{message}&f"'
      format: '&f{orpdesc_name}&c yells: &f"&c&l{message}&f"'
      range: 48
      cooldown: 0
#      action:
#         symbol: '*'
#         replacement:
#            outside-of-actions: '&f'
#            for-actions: '&e*'
            
   whisper:
      display-name: Whisper
      commands:
      - whisper
      - wh
      use-perm: orpchat.default
      read-perm: orpchat.default
      color-code-perm: orpchat.usecolors
#      format: '&f[&dWhisper&f] &f{orpdesc_name}: &f"&d{message}&f"'
      format: '&f{orpdesc_name}#55aaff whispers: &f&o"#55aaff&o{message}&f&o"'
      range: 2
      cooldown: 0
#      action:
#         symbol: '*'
#         replacement:
#            outside-of-actions: '&f'
#            for-actions: '&e*'
            
   looc:
      display-name: LOOC
      commands:
      - looc
      use-perm: orpchat.default
      read-perm: orpchat.default
      color-code-perm: orpchat.usecolors
      format: '&f[&2LOOC&f] &f{player}: &7{message}'
      range: 20
      cooldown: 0
      
   ooc:
      display-name: OOC
      commands:
      - ooc
      use-perm: orpchat.default
      read-perm: orpchat.default
      color-code-perm: orpchat.usecolors
      format: '&f[&9OOC&f] &f{player}: &7{message}'
      range:
      cooldown: 0
      
   action:
      display-name: Action
      commands:
      - me
      use-perm: orpchat.default
      read-perm: orpchat.default
      color-code-perm: orpchat.usecolors
#      format: '&e* &f{orpdesc_name} &d{message}'
      format: '&e* &f{orpdesc_name} &d{message}'
      range: 20
      cooldown: 0
      
   admin:
      display-name: Admin
      commands:
      - admin
      - a
      use-perm: orpchat.adminchat
      read-perm: orpchat.adminchat
      color-code-perm: orpchat.usecolors
      format: '&f[&cAdmin&f] &e{player}: &f{message}'
      range:
      cooldown: 0
      
   helper:
      display-name: Helper
      commands:
      - helper
      - h
      use-perm: orpchat.helperchat
      read-perm: orpchat.helperchat
      color-code-perm: orpchat.usecolors
      format: '&f[&dHelper&f] &e{player}: &f{message}'
      range:
      cooldown: 0

#   trade:
#      display-name: Trade
#      commands:
#      - trade
#      - ah
#      use-perm: orpchat.default
#      read-perm: orpchat.default
