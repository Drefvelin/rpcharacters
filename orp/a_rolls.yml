Events:
  modifier_roll:
    type: player_command
    conditions:
    - '%command% contains /tfmc roll'
    -  '%arg_2% < 1 execute error'
    -  '%arg_3% startsWith + or %arg_3% startsWith -'
    actions:
      default:
      - 'cancel_event: true'
      - 'console_command: execute at %player% run tellraw @a[distance=..20] [{"text":"%player% ","color":"yellow"},{"text":"rolled a ","color":"gray"},{"text":"%rng_1,{args_substring_2-2}%","color":"gold"},{"text":"%args_substring_3-3%  ","color":"gray"},{"text":"out of %args_substring_2-2%.","color":"gray"}]'
