welcome_stage:
    type: info
    repeat: false
    interval: 60
    auto-next: false
    messages:
        - "title(#c9a24fWelcome to TFMC)"
        - "subtitle(§7Create a character to play.)"
        - "subtitle(§7#32ed73/rpcharacter next)"
creation_info_stage:
    type: info
    repeat: false
    interval: 60
    auto-next: false
    messages:
        - "title(#c9a24fCharacter Creation)"
        - "subtitle(§7Race, class, and background lock later.)"
        - "subtitle(§7Ignore your traits and that's FailRP.)"
        - "subtitle(§7#32ed73/rpcharacter next)"
creation_name_stage:
    type: info
    repeat: false
    interval: 60
    auto-next: false
    messages:
        - "title(#c9a24fCharacter Name)"
        - "subtitle(§7Type the name in chat next.)"
        - "subtitle(§7No IGNs or copyrighted names.)"
        - "subtitle(§7#32ed73/rpcharacter next)"
creation_name_set_stage:
    type: setter
    target: name
    repeat: true
    message: subtitle(§7Type your character name in chat)
class_info_stage:
    type: info
    repeat: true
    interval: 60
    auto-next: false
    messages:
        - "title(#c9a24fChoose Your Class)"
        - "subtitle(§7Class sets weapons and skills.)"
        - "subtitle(§7#32ed73/rpcharacter next)"
class_selection_stage:
    type: selection
    lock-time: 5d
    repeat: true
    target: class
    min-select: 1
    max-select: 1
    auto-next: true
    gui-size: 54
race_selection_stage:
    type: selection
    lock-time: 24h
    repeat: true
    target: race
    key: race
    min-select: 1
    max-select: 1
    slots: [10, 11, 12, 13, 14, 15, 16]
character_age_stage:
    type: setter
    lock-time: 5d
    target: age
    repeat: true
    auto-next: true
    message: subtitle(§7Type your character age in chat)
cataclysm_selection_stage:
    type: selection
    lock-time: 5d
    repeat: true
    target: trait
    key: cataclysm
    min-select: 1
    max-select: 1
    slots: [10, 11, 12, 13, 14, 15, 16]
reclamation_selection_stage:
    type: selection
    lock-time: 5d
    repeat: true
    target: trait
    key: reclamation
    min-select: 1
    max-select: 1
    slots: [10, 11, 12, 13, 14, 15, 16]
expedition_selection_stage:
    type: selection
    lock-time: 5d
    repeat: true
    target: trait
    key: expedition
    min-select: 1
    max-select: 1
    slots: [10, 11, 12, 13, 14, 15, 16]
ambition_selection_stage:
    type: selection
    lock-time: 5d
    repeat: true
    target: trait
    key: ambition
    min-select: 1
    max-select: 1
    slots: [10, 11, 12, 13, 14, 15, 16]
physical_selection_stage:
    type: selection
    lock-time: 5d
    repeat: true
    target: trait
    key: physical
    min-select: 1
    max-select: 3
    points: 1
    gui-size: 54
    slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
celestial_selection_stage:
    type: selection
    lock-time: 5d
    repeat: true
    target: trait
    key: celestial
    min-select: 1
    max-select: 1
    slots: [10, 11, 12, 13, 14, 15, 16]
personality_selection_stage:
    type: selection
    repeat: true
    target: trait
    key: personality
    min-select: 3
    max-select: 5
    points: 4
    gui-size: 54
    slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
evil_info_stage:
    type: info
    repeat: true
    interval: 60
    auto-next: false
    dependency:
        type: trait
        mode: one-or-more
        depends-on:
            - callous
            - spiteful
            - greedy
            - deceitful
            - cynical
    messages:
        - "title(#c9a24fEvil RP)"
        - "subtitle(§7Pick up to 2 evil archetypes, or skip.)"
        - "subtitle(§7#32ed73/rpcharacter next)"
creation_description_stage:
    type: info
    repeat: false
    interval: 60
    auto-next: false
    messages:
        - "title(#c9a24fCharacter Description)"
        - "subtitle(§732 to 256 characters.)"
        - "subtitle(§7#32ed73/rpcharacter next)"
creation_description_set_stage:
    type: setter
    target: description
    repeat: true
    auto-next: true
    message: subtitle(§7Type your character description in chat)
clue_info_stage:
    type: info
    repeat: false
    interval: 60
    auto-next: false
    messages:
        - "title(#c9a24fCharacter Clues)"
        - "subtitle(§7How others spot your character.)"
        - "subtitle(§7Evil needs more clues.)"
        - "subtitle(§7#32ed73/rpcharacter next)"
clue_entry_stage:
    type: clue
    repeat: true
    auto-next: true
    message: subtitle(§7Type clue {current}/{needed} in chat)
creation_summary_stage:
    type: summary
    repeat: true
    auto-next: false
    entries:
        name: creation_name_set_stage
        class: class_selection_stage
        race: race_selection_stage
        age: character_age_stage
        description: creation_description_set_stage
        cataclysm: cataclysm_selection_stage
        reclamation: reclamation_selection_stage
        expedition: expedition_selection_stage
        ambition: ambition_selection_stage
        physical: physical_selection_stage
        celestial: celestial_selection_stage
        personality: personality_selection_stage
        evil: evil_selection_stage
        clues: clues
