rower:
    name: "§aExpedition Deckhand"
    key: expedition
    description:
        - "§7This character performed physical tasks on one"
        - "§7of the vessels during the Calavorian Expedition."
    attribute-modifiers:
        - strength.3
        - constitution.3
        - charisma.2
        - wisdom.2
    experience-modifiers:
        smith:
            modifier: 5
        miner:
            modifier: 5
        forester:
            modifier: 5

planner:
    name: "§aExpedition Navigator"
    key: expedition
    description:
