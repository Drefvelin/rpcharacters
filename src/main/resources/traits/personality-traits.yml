stubborn:
    name: "§cStubborn"
    key: personality
    cost: -1
    mutually-exclusive:
        - flexible
    description:
        - "§7This character does not back down for anything."
trusting:
    name: "§cTrusting"
    key: personality
    cost: -1
    mutually-exclusive:
        - paranoid
    description:
        - "§7This character is quick to place their faith in others."
paranoid:
    name: "§cParanoid"
    key: personality
    cost: -1
    mutually-exclusive:
        - trusting
    description:
        - "§7This character sees enemies in every shadow."