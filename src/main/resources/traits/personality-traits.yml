brave:
    name: "§aBrave"
    key: personality
    cost: 2
    mutually-exclusive:
        - craven
    description:
        - "§7Challenges or danger, this character fears nothing."
craven:
    name: "§cCraven"
    key: personality
    cost: -1
    mutually-exclusive:
        - brave
    description:
        - "§7This character does not enjoy being challenged, or scared, at all."
zealous:
    name: "§aZealous"
    key: personality
    mutually-exclusive:
        - cynical
    cost: 2
    description:
        - "§7Conviction to faith or cause burns bright at the center of this character."
just:
    name: "§aJust"
    key: personality
    mutually-exclusive:
        - cynical
    cost: 2
    description:
        - "§7This character has a strong sense of justice."
cynical:
    name: "§aCynical"
    key: personality
    mutually-exclusive:
        - just
        - zealous
    cost: 2
    description:
        - "§7This character trusts in self-interest above all else."
content:
    name: "§cContent"
    key: personality
    cost: -1
    mutually-exclusive:
        - ambitious
        - greedy
    description:
        - "§7What they already have is enough for this character."
ambitious:
    name: "§aAmbitious"
    key: personality
    cost: 2
    mutually-exclusive:
        - content
    description:
        - "§7This character knows what they want, and are not afraid to try and get it."
generous:
    name: "§cGenerous"
    key: personality
    cost: -1
    mutually-exclusive:
        - greedy
    description:
        - "§7Acts of benevolence and charity are no strangers to this character."
greedy:
    name: "§aGreedy"
    key: personality
    cost: 2
    mutually-exclusive:
        - generous
        - content
    description:
        - "§7This character keeps a tight grip on their purse, always looking to engorge it."
compassionate:
    name: "§aCompassionate"
    key: personality
    cost: 2
    mutually-exclusive:
        - spiteful
        - callous
    description:
        - "§7Both merciful and sympathetic, this characer is warmhearted."
spiteful:
    name: "§cSpiteful"
    key: personality
    cost: -1
    mutually-exclusive:
        - compassionate
    description:
        - "§7Few things brings this character as much joy as the suffering of others."
callous:
    name: "§aCallous"
    key: personality
    cost: 2
    mutually-exclusive:
        - compassionate
    description:
