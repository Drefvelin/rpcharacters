bastion:
    name: "#87d65cBastion Refugee"
    key: cataclysm
    description:
        - "§7This character or their parents survived by taking"
        - "§7refuge in Bastion during the Decarian Cataclysm."
        - ""
        - "#d65c5c§lOseni:§r#d65c5c This character or their parents aided the"
        - "#d65c5cOseni invasion effort through non-violent means."
    attribute-modifiers:
        - intelligence.2
        - strength.1
        - dexterity.1
        - wisdom.1
        - charisma.1
    experience-modifiers:
        agriculturist:
            modifier: 10
        forester:
            modifier: 5
        miner:
            modifier: 5

