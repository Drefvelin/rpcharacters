#Strength
strong:
    name: "§aStrong"
    cost: 1
    key: physical
    mutually-exclusive:
        - weak
    description:
        - "§7This character has a strong physique."
    attribute-modifiers:
        - strength.2
weak:
    name: "§cWeak"
    cost: -1
    key: physical
    mutually-exclusive:
        - strong
    description:
        - "§7This character lacks physical prowess."
    attribute-modifiers:
        - strength.-2
