# required-account-playtime: hours since account creation (not time played)
bandit:
    name: "#d65c5cBandit"
    key: evil
    required-account-playtime: 24
    dependency:
        type: trait
        mode: one-or-more
        depends-on:
            - spiteful
            - greedy
            - callous
    mutually-exclusive:
        - content
        - compassionate
        - craven
    description:
        - "#d6cf69[#d65c5cEvil#d6cf69]"
        - "§7This character is a bandit, robbing their way to the top."
        - " "
        - "#d6cf69Unlocks: #d65c5cBandit §7type Evil RP"
