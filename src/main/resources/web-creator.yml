# Minimum donator tier required to use the web character creator, per realm.
# Tier numbers match permission-groups.yml (0 = everyone, 1 = noble+, etc.).
# Synced to ProvinceSystem via the creation catalog; enforced on the website.
#
# Set min-tier to 0 when the creator opens to all players (e.g. at season start).
by-realm:
  main:
    min-tier: 1
    min-group-id: noble
  tutorial:
    min-tier: 0
  dev:
    min-tier: 0
